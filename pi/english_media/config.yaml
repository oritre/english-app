name: English app videos
version: "1.0.0"
slug: english_media
description: Downloads the general-knowledge videos of the לימודים app once and serves them to the family's devices, without YouTube or ads.
url: https://github.com/oritre/english-app/tree/main/pi/english_media
arch: [aarch64, amd64, armv7]
init: false
boot: auto
startup: application
ports:
  8811/tcp: 8811
ports_description:
  8811/tcp: Video server (also reachable over Tailscale Funnel)
map:
  - media:rw
options:
  family_code: ""
  tailscale_authkey: ""
  tailscale_hostname: english-media
  quality: 720
  videos_url: https://oritre.github.io/english-app/data/videos.json
schema:
  family_code: password
  tailscale_authkey: password?
  tailscale_hostname: str
  quality: int(240,1080)
  videos_url: url
